<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spots</title>
    <meta name="author" content="Samir Roy" />
    <meta name="keywords" content="Spots, software engineer, Samir Roy" />
    <meta
      name="description"
      content="It's a social landing page developed by Samir Roy"
    />
    <!-- <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" /> -->
  </head>
  <body>
    <div class="page hidden">
      <header class="header">
        <img
          src="<%=require('./images/Logo.svg')%>"
          alt="spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img src="<%=require('./images/edit_pencil.svg')%>" alt="" />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="current user's avatar"
              class="profile__avatar"
            />
          </div>

          <div class="profile__column">
            <h2 class="profile__name">Bessie Colemann</h2>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-button" type="button">
              <img src="<%=require('./images/pencil.svg')%>" alt="pencil" />Edit
              Profile
            </button>
          </div>
          <button class="profile__post-button" type="button">+ New Post</button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card_template">
              <li class="card">
                <img src="" alt="" class="card__image" />
                <div class="card__content">
                  <h3 class="card__name"></h3>
                  <button type="button" class="card__like-button"></button>
                </div>
                <button class="card__delete-button">
                  <img
                    src="<%=require('./images/delete.svg')%>"
                    alt="card delete button"
                    class="card__delete-icon"
                  />
                </button>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <section class="modal" id="edit-modal">
        <div class="modal__container">
          <h2 class="modal__title">Edit Profile</h2>
          <button class="modal__close-btn" type="button"></button>
          <form class="modal__form" name="edit_profile" id="profile-form">
            <label class="modal__label">
              Name
              <input
                type="text"
                class="modal__input"
                name="name"
                id="name"
                minlength="2"
                maxlength="40"
                placeholder="Type your name"
                required
              />
              <span class="modal__error" id="name-error">Error!!</span>
            </label>
            <label class="modal__label">
              Description
              <input
                type="text"
                class="modal__input"
                name="description"
                id="description"
                minlength="2"
                maxlength="200"
                placeholder="Describe yourself"
                required
              />
              <span class="modal__error" id="description-error">Error!!</span>
            </label>
            <button class="modal__submit-btn" type="submit">Save</button>
          </form>
        </div>
      </section>
      <!-- new post modal -->
      <section class="modal" id="new-post-modal">
        <div class="modal__container">
          <h2 class="modal__title">New Post</h2>
          <button class="modal__close-btn" type="button"></button>
          <form class="modal__form" name="edit_profile" id="new-post-form">
            <label class="modal__label">
              Image Link
              <input
                type="url"
                class="modal__input"
                name="image-link"
                id="image-link"
                placeholder="Image Link"
                required
              />
              <span class="modal__error" id="image-link-error">Error!!</span>
            </label>
            <label class="modal__label">
              Caption
              <input
                type="text"
                class="modal__input"
                name="image-caption"
                id="image-caption"
                placeholder="Image Caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="modal__error" id="image-caption-error">Error!!</span>
            </label>
            <button class="modal__submit-btn" type="submit">Save</button>
          </form>
        </div>
      </section>
      <!-- Image Preview modal -->
      <section class="modal" id="preview-modal">
        <div class="modal__image-container">
          <img
            src="https://practicum-content.s3.us-west-1.amazonaws.com/software-engineer/spots/7-photo-by-griffin-wooldridge-from-pexels.jpg"
            alt=""
            class="modal__image"
          />
          <button
            class="modal__close-btn_type_preview modal__close-btn"
            type="button"
          ></button>
          <p class="modal__caption">Image Caption</p>
        </div>
      </section>
      <!-- Edit Avatar modal -->
      <section class="modal" id="edit-avatar">
        <div class="modal__container">
          <h2 class="modal__title">Edit Avatar</h2>
          <button class="modal__close-btn" type="button"></button>
          <form class="modal__form" name="edit_avatar" id="avatar-form">
            <label class="modal__label">
              Avatar URL
              <input
                type="url"
                class="modal__input"
                name="avatar__input"
                id="avatar-input-link"
                placeholder="Avatar Link here"
                required
              />
              <span class="modal__error" id="avatar-input-link-error"
                >Error!!</span
              >
            </label>
            <button class="modal__submit-btn" type="submit">Update</button>
          </form>
        </div>
      </section>
      <section class="modal modal__delete" id="delete-modal">
        <div class="modal__container">
          <h3 class="modal__title delete-modal__title">
            Are you sure, you want to delete this image?
          </h3>
          <button class="modal__close-btn" type="button"></button>
          <form
            class="modal__form modal__form-delete"
            name="delete_card"
            id="delete-form"
          >
            <button
              class="modal__submit-btn delete-modal__submit-btn"
              type="submit"
              id="delete-confirm"
            >
              Delete
            </button>
            <button
              class="modal__submit-btn modal__cancel-btn delete-modal__submit-btn"
              type="button"
            >
              Cancel
            </button>
          </form>
        </div>
      </section>
      <footer class="footer">
        <p class="footer__text">2025 @ Samir Roy</p>
      </footer>
    </div>
  </body>
</html>
